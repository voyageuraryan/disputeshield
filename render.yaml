# Render Blueprint: backend API (web service) + frontend (static site).
# Secrets use `sync: false`: Render prompts for them on first Blueprint creation.
services:
  - type: web
    name: disputeshield-api
    runtime: python
    rootDir: backend
    # FREE plan (user decision 2026-11-04): sleeps after 15 min idle (~30 s cold start) and has NO persistent disk, so
    # the SQLite DB is empty after every sleep / restart / deploy. AUTO_SEED rebuilds the demo data on startup and the
    # poller re-imports the sandbox disputes from PayPal. For persistence switch to `plan: starter` + the disk below.
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process only: the dispute poller runs inside it, and SQLite is single-writer.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # disk:                 # paid plans only; with `plan: starter`, uncomment and point the paths below at /var/data
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: DATABASE_URL       # ephemeral on the free plan (starter + disk: sqlite:////var/data/disputeshield.db)
        value: sqlite:///./disputeshield.db
      - key: CHECKPOINT_DB      # paused agent runs (approval falls back to direct execution if lost)
        value: ./checkpoints.db
      - key: AUTO_SEED          # free plan: rebuild the demo store + demo analytics history on an empty DB
        value: "true"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Buyer troubleshooting web research fallback (optional; free tier 1,000 credits/month)
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Log in with PayPal (merchant login). AUTH_MODE=off is ignored on Render.
      - key: AUTH_MODE
        value: paypal
      - key: AUTH_SECRET
        generateValue: true
      - key: MERCHANT_LOGIN_EMAILS  # e.g. your sandbox business account email
        sync: false
      - key: AUTH_REDIRECT_URI      # https://<api-host>/api/auth/paypal/callback (also add it in the PayPal app)
        sync: false
      - key: FRONTEND_URL           # https://<static-site-host>
        sync: false
      - key: ARTIFACTS_DIR
        value: ./artifacts
      - key: CORS_ORIGINS  # the static site's URL, e.g. https://disputeshield-web.onrender.com
        sync: false
      - key: POLL_DISPUTES
        value: "true"
      - key: POLL_INTERVAL_S
        value: "60"
      # One dedicated Gemini key per role (unset -> GEMINI_API_KEY; never fails over to another role's key)
      - key: RESEARCH_GEMINI_API_KEY
        sync: false
      - key: EVALS_JUDGE_GEMINI_API_KEY
        sync: false
      - key: EVALS_SIMULATOR_GEMINI_API_KEY
        sync: false
      # Phase 9B: buyer help-page links point here (the static site's URL, same as FRONTEND_URL)
      - key: BUYER_PORTAL_URL
        sync: false
      # Phase 15: key for the hashed checkout signals (IP / device / payer id); keep it stable once set
      - key: SIGNAL_HASH_KEY
        generateValue: true
      # Phase 12: Gemini reads merchant uploads to prefill fields (user decision G103: on)
      - key: UPLOAD_EXTRACTION
        value: "true"
      # Phase 17: this API's own public URL (MCP endpoint = <PUBLIC_API_URL>/mcp), e.g. https://disputeshield-api-l7ne.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      # Phase 17: alerts (optional). Email via SMTP (STARTTLS) and/or a Slack incoming webhook.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      # Phase 16: demo mode (Scenarios drawer) needs DEMO_MODE=true AND ADMIN_TOKEN. Keep false unless demoing.
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_BUYER_EMAIL
        sync: false

  - type: web
    name: disputeshield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of disputeshield-api, e.g. https://disputeshield-api-l7ne.onrender.com
      # (fromService `host` is the private-network hostname, which browsers can't reach.)
      - key: VITE_API_BASE_URL
        sync: false
    # Security review 2026-11-05: no framing of the dashboard (clickjacking); never send the page's path/query
    # (the buyer help link carries its token in ?t=) to other sites. A full CSP stays future work (PayPal SDK, Bryntum).
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
