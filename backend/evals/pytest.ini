[pytest]
# The real-LLM eval suite. Run via scripts/run_evals.sh (deepeval test run evals/ --config-file=evals/pytest.ini).
# Unlike backend/pytest.ini, the DeepEval plugin is allowed here (deepeval test run adds -p deepeval).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
norecursedirs = goldens metrics reports .cache
