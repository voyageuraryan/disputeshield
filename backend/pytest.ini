[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# evals/ is the real-LLM evaluation suite: run it with scripts/run_evals.sh (deepeval test run), never here.
norecursedirs = evals .venv node_modules artifacts recorded_webhooks
# DeepEval's pytest plugin loads .env files into os.environ (real keys!) and sends usage telemetry; unit tests
# must stay hermetic and offline, so it's never loaded here (the eval run uses evals/pytest.ini instead).
addopts = -p no:deepeval
markers =
    real_auth: run without the default logged-in-merchant override
